name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-skills.mjs
      - run: node --test skills/pstack-pi/pstack-poteto-mode/scripts/todo.test.mjs
      - run: node --test skills/pstack-pi/setup-pstack/scripts/models.test.mjs
      - run: node --test scripts/upstream-diff.test.mjs
